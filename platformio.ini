; Sticky Piano Remote — Seeed reTerminal Sticky (ESP32-S3, 32 MB flash, 8 MB PSRAM)
; Base env derived from papyrix-reader's proven `sticky_base` config (MIT).
; Options: add -DMIDI_CHANNEL=n to build_flags to change the piano voice channel.
[env:sticky]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_16MB.csv

build_unflags =
  -fno-lto
  -fexceptions
  -Os
  -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
  -Oz
  -flto=auto
  -fno-exceptions
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DBOARD_HAS_PSRAM
  -DPAPYRIX_TARGET_STICKY=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -std=c++2a

lib_deps =
  adafruit/Adafruit GFX Library@1.13.0
  h2zero/NimBLE-Arduino@2.5.2
